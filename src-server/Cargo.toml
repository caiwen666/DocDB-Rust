[package]
name = "src-server"
version = "0.1.0"
edition = "2024"

[dependencies]
salvo = { version = "0.78.0", features = ["oapi"] }
tokio = { version = "1.44.2", features = ["macros"] }
tracing = "0.1.41"
tracing-subscriber = "0.3.19"
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.8.22"
clia-tracing-config = "0.2.7"
serde_json = "1.0.140"
anyhow = "1.0.98"
thiserror = "2.0.12"
sea-orm = { version = "1.1.10", features = ["sqlx-mysql", "runtime-tokio", "macros", "with-chrono", "with-time", "with-json"] }
src-shared = { path = "../src-shared" }